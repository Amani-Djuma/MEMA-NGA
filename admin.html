<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mema Nga - Espace Administration Sécurisé</title>
    
    <!-- Polices & Icônes Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SDK Supabase (Gestion de la sécurité serveur) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* OVERLAY DE CONNEXION */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #090d16, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-logo {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--accent);
            font-size: 1.8rem;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            border: 2px solid var(--accent);
        }

        .login-card h2 { font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; font-weight: 800; }
        .login-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 25px; }

        .form-group-admin {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group-admin label {
            display: block; font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 6px;
        }

        .form-group-admin input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group-admin input:focus { border-color: var(--accent); }

        .btn-login {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: var(--accent-hover); }

        .error-msg {
            color: #ef4444; font-size: 0.8rem; margin-top: 12px; display: none;
        }

        /* TABLEAU DE BORD (MASQUÉ PAR DÉFAUT) */
        #adminDashboard {
            display: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 5%;
            flex-grow: 1;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .admin-header h1 { font-size: 1.4rem; color: var(--primary); font-weight: 800; }
        .admin-header h1 span { color: var(--accent); }

        .btn-logout {
            background: #fee2e2;
            color: #991b1b;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-logout:hover { background: #fecaca; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }
        .stat-card h3 { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        .stat-card .number { font-size: 2rem; font-weight: 800; color: var(--primary); }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- CONNEXION SÉCURISÉE PAR SERVEUR -->
    <div id="loginOverlay">
        <div class="login-card">
            <div class="login-logo"><i class="fas fa-shield-alt"></i></div>
            <h2>Espace Sécurisé</h2>
            <p>Authentification administrateur via Supabase</p>
            
            <form onsubmit="seConnecter(event)">
                <div class="form-group-admin">
                    <label for="adminEmail"><i class="fas fa-envelope"></i> Email Administrateur</label>
                    <input type="email" id="adminEmail" required placeholder="admin@memanga.online">
                </div>
                <div class="form-group-admin">
                    <label for="adminPassword"><i class="fas fa-key"></i> Mot de passe</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••••••">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Se connecter</button>
                <div id="errorMsg" class="error-msg">Identifiants incorrects ou accès refusé.</div>
            </form>
        </div>
    </div>

    <!-- TABLEAU DE BORD D'ADMINISTRATION -->
    <div id="adminDashboard">
        <div class="admin-header">
            <h1>Mema Nga • <span>Administration Sécurisée</span></h1>
            <button class="btn-logout" onclick="seDeconnecter()"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Statut de connexion</h3>
                <div class="number" style="font-size: 1.1rem; color: #16a34a;"><i class="fas fa-check-circle"></i> Authentifié</div>
            </div>
            <div class="stat-card">
                <h3>Protection des données</h3>
                <div class="number" style="font-size: 1.1rem; color: var(--accent);"><i class="fas fa-lock"></i> SSL / API REST</div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Mema Nga • Administration sécurisée par Supabase
    </footer>

    <script>
        // REMPLACEZ CES DEUX LIGNES AVEC VOS CLÉS SUPABASE
        const SUPABASE_URL = "https://TON_PROJET.supabase.co";
        const SUPABASE_ANON_KEY = "TA_CLE_ANON_PUBLIQUE";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Vérification de session au chargement de la page
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                afficherDashboard();
            }
        });

        // Fonction de connexion sécurisée
        async function seConnecter(event) {
            event.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerText = "Vérification...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
                loginBtn.innerText = "Se connecter";
            } else {
                afficherDashboard();
            }
        }

        function afficherDashboard() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
        }

        async function seDeconnecter() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }
    </script>
</body>
</html>
